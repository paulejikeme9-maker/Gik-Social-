
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0866ff">
  <title>Gik - Connect with the world</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Gik</a>
    <input id="search" type="search" placeholder="Search Gik">
    <nav>
      <button data-page="home">Home</button>
      <button data-page="friends">Friends</button>
      <button data-page="videos">Videos</button>
      <button data-page="groups">Groups</button>
      <button data-page="messages">Messages</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h3>Your shortcuts</h3>
      <button data-page="profile">My Profile</button>
      <button data-page="saved">Saved posts</button>
      <button data-page="community">Communities</button>
      <a href="admin.html">Gik Control Center</a>
    </aside>

    <section class="feed">
      <h1 id="page-title">Welcome to Gik</h1>
      <form id="post-form" class="card">
        <textarea id="post-text" placeholder="What's happening around the world?" required></textarea>
        <button type="submit">Publish post</button>
      </form>
      <div id="posts"></div>
    </section>

    <aside class="sidebar">
      <h3>Discover Gik</h3>
      <p>Connect with friends and communities around the world.</p>
      <p class="notice">Gik is under development. Please don't share sensitive information in this demo.</p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
